<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5.3.8 class audit — Forms</title>
  <link rel="icon" href="assets/img/favicon/favicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!--
  Everything inside <main id="bs-demo"> is a self-contained fragment:
  copy it into the <body> of any Bootstrap 5.3 site to audit that site's theme.
  Remove data-bsd-page there: it only drives the page switch between the demo pages.
-->
<main id="bs-demo" data-bsd-page="forms" data-bs-spy="scroll" data-bs-target="#bsd-nav" data-bs-smooth-scroll="true">
  <!-- Toolbar, sidebar (#bsd-nav) and tokens panel are built by assets/js/bsd-demo.js -->

  <div class="container-fluid">
    <div class="row">

      <!-- Demo content -->
      <div class="col-lg-9 col-xl-10 px-lg-4 pt-5 pb-5">

        <header class="pt-4 pb-3 border-bottom">
          <h1 class="h2 mb-0">Bootstrap 5.3.8 class audit: forms</h1>
        </header>

        <!-- ============================================================ -->
        <!-- Intro                                                        -->
        <!-- ============================================================ -->
        <section id="bsd-forms-intro" class="py-4">
          <h2 class="h4 mb-3">About this page</h2>
          <p>This page will collect every form example: controls, selects, checks and radios, ranges, input groups, floating labels, layout and validation. The sections move over from the Classes page one at a time.</p>
        </section>

        <!-- bsd:continue -->

      </div>
    </div>
  </div>

  <!-- Screen reader announcements for the demo tooling -->
  <div class="visually-hidden" aria-live="polite" id="bsd-live"></div>

  <!-- Demo tooling (classic script, runs before the Bootstrap bundle below) -->
  <script src="assets/js/bsd-demo.js"></script>

</main>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
